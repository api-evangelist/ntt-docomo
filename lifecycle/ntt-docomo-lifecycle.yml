description: >-
  NTT DOCOMO, Inc. publishes no API versioning policy, no deprecation policy and
  no SLA, because it publishes no self-serve API. What it does publish are
  service-level lifecycle notices: a maintenance-window page for the d ACCOUNT
  Connect application site, a network-outage notice page for the mobile network,
  and dated end-of-service announcements for retired platforms. The lifecycle
  record of DOCOMO's developer programme is one of contraction — an API
  marketplace that opened in 2013 and closed in 2021, and an OpenID 2.0 login
  that ended in 2020.
