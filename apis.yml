name: NTT Docomo
kind: company
description: >-
  NTT DOCOMO, Inc. is Japan's largest mobile network operator and a wholly owned
  subsidiary of Nippon Telegraph and Telephone (NTT), serving roughly 90 million
  mobile subscriptions in its home market of Japan across the docomo, ahamo and
  irumo brands, alongside the d ACCOUNT identity, d POINT loyalty, d Payment
  wallet and Lemino media franchises. In the telecom value chain DOCOMO is a
  facilities-based incumbent carrier — it owns the 5G radio, core and subscriber
  identity — but it does not sell that capability to developers directly. Its API
  posture is partner-gated and sales-led: the first-party "docomo Developer
  support" programme launched in 2013 was shut down on 31 March 2021 and its host
  no longer resolves, no developer, developers, docs, api or opengateway subdomain
  exists on docomo.ne.jp, and the only surviving public developer page documents
  handset and content technical information rather than any HTTP API. DOCOMO's
  network APIs reach developers only through aggregation: the company participates
  in the GSMA Open Gateway initiative and signed a distribution partnership with
  Aduna, the Ericsson-and-carrier joint venture, on 29 January 2026 to expose
  CAMARA Number Verification and SIM Swap for international markets — a commitment
  announced in press releases, with nothing callable published first-party as of
  this profile. Enterprise and wholesale API traffic is redirected to sibling
  company NTT DOCOMO BUSINESS on a separate domain.
