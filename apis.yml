apis:
- aid: ntt-docomo:d-account-connect
  name: d ACCOUNT Connect
  description: >-
    d ACCOUNT Connect (dアカウント・コネクト) is DOCOMO's carrier identity service for
    businesses, offering OpenID Connect based social login backed by network line
    authentication and device biometrics against roughly 90 million d ACCOUNT
    registrations and approximately 2,000 implemented sites. A live, anonymous
    OpenID Connect discovery document is served at
    https://conf.uw.docomo.ne.jp/.well-known/openid-configuration (HTTP 200,
    fetched 2026-07-25) declaring issuer https://conf.uw.docomo.ne.jp/, the
    authorization endpoint https://id.smt.docomo.ne.jp/cgi8/oidc/authorize, token
    and userinfo endpoints, pairwise subject identifiers, response_types of code
    only, and HS256/RS256 ID token signing. No backchannel authentication endpoint
    is advertised, so CIBA — the grant CAMARA specifies for network-based
    authorization — is not exposed here. The integration manual and technical
    specification are downloadable only after submitting a use application and
    passing DOCOMO's review; no OpenAPI definition is published.
  humanURL: https://id.smt.docomo.ne.jp/src/index_business.html
  baseURL: https://conf.uw.docomo.ne.jp/
