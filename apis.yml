apis:
- aid: ntt-docomo:d-account-connect
  name: d ACCOUNT Connect
  description: >-
    d ACCOUNT Connect (dアカウント・コネクト) is DOCOMO's carrier identity service for
    businesses, offering OpenID Connect based social login backed by network line
    authentication and device biometrics against roughly 90 million d ACCOUNT
    registrations and approximately 2,000 implemented sites. A live, anonymous
    OpenID Connect discovery document is served at
    https://conf.uw.docomo.ne.jp/.well-known/openid-configuration (HTTP 200,
    fetched 2026-07-25) declaring issuer https://conf.uw.docomo.ne.jp/, the
    authorization endpoint https://id.smt.docomo.ne.jp/cgi8/oidc/authorize, token
    and userinfo endpoints, pairwise subject identifiers, response_types of code
    only, and HS256/RS256 ID token signing. No backchannel authentication endpoint
    is advertised, so CIBA — the grant CAMARA specifies for network-based
    authorization — is not exposed here. The integration manual and technical
    specification are downloadable only after submitting a use application and
    passing DOCOMO's review; no OpenAPI definition is published.
  humanURL: https://id.smt.docomo.ne.jp/src/index_business.html
  baseURL: https://conf.uw.docomo.ne.jp/
  tags:
  - Identity
  - OpenID Connect
  - Authentication
  - Carrier Identity
  - Partner Gated
  properties:
  - type: Documentation
    url: https://id.smt.docomo.ne.jp/src/index_business.html
  - type: APIReference
    url: https://id.smt.docomo.ne.jp/src/dlogin/ctop_method.html
  - type: OpenIDConnectDiscovery
    url: https://conf.uw.docomo.ne.jp/.well-known/openid-configuration
- aid: ntt-docomo:docomo-mail-imap-interface
  name: docomo Mail IMAP Interface
  description: >-
    The docomo Mail IMAP interface is the one machine-interface specification NTT
    DOCOMO publishes openly, without registration, to third-party developers. It
    documents how a mail client connects to the docomo Mail service over IMAP,
    and is distributed as a 96-page Japanese PDF specification
    (mail_imap_spec_260126.pdf, HTTP 200, application/pdf, 1,229,737 bytes,
    revision dated 2026-01-26). This is an IMAP protocol interface, not an HTTP
    API: there is no REST surface, no OpenAPI definition, no API key issuance and
    no sandbox associated with it.
  humanURL: https://www.docomo.ne.jp/service/developer/smart_phone/application/imap/
  tags:
  - Email
  - IMAP
  - Protocol
  - Specification
  properties:
  - type: Documentation
    url: https://www.docomo.ne.jp/service/developer/smart_phone/application/imap/
  - type: APIReference
    url: https://www.docomo.ne.jp/binary/pdf/service/developer/smart_phone/application/imap/mail_imap_spec_260126.pdf
