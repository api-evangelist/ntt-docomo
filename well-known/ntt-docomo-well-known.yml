source: >-
  Live probes of the /.well-known/ discovery surface on every host reachable from
  apis.yml — the d ACCOUNT Connect OIDC configuration host (conf.uw.docomo.ne.jp),
  the d ACCOUNT authorization host (id.smt.docomo.ne.jp), the corporate/developer
  host (www.docomo.ne.jp) and the JWKS host advertised by the discovery document
  (fr-end.oidc.if.cilite.docomo.ne.jp). Probed 2026-07-25.
description: >-
  NTT DOCOMO, Inc. publishes exactly one anonymous machine-readable discovery
  document: the OpenID Connect configuration for d ACCOUNT Connect. It is served
  from an AWS API Gateway / CloudFront edge (server openresty, x-amz-cf-id
  present) with a Last-Modified of 2023-08-17, is 541 bytes, and is minimal —
  it declares only the four endpoints, response_types, subject_types and
  id_token signing algorithms. It carries no scopes_supported,
  grant_types_supported, token_endpoint_auth_methods_supported,
  claims_supported, registration_endpoint or backchannel_authentication_endpoint,
  so the OIDC feature surface cannot be read from metadata alone; the full
  specification is gated behind DOCOMO's application-and-review process. The
  JWKS URI it points at is anonymously readable and returns a single RSA
  signing key. Note that conf.uw.docomo.ne.jp answers 403 (not 404) to every
  other path — 403 is that host's default deny, not evidence a document exists.
