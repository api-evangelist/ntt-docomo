  dmarc: true
  dmarc_policy: none
  dmarc_subdomain_policy: none
  dmarc_pct: 100
  dmarc_rua: mailto:dm0mlsugqaev8.rua@dp.smtps.jp
  notes: >-
    The corporate domain runs DMARC in monitor mode (p=none) while the
    consumer/service domain enforces quarantine with sp=reject.
findings:
- severity: notable
  finding: >-
    id.smt.docomo.ne.jp — the d ACCOUNT authorization endpoint host — does not
    support TLS 1.3, sends no HSTS header, and lacks RFC 5746 secure
    renegotiation.
- severity: notable
  finding: >-
    No CAA records on either registrable domain, so no certificate-authority
    issuance restriction is published.
- severity: notable
  finding: No DNSSEC on docomo.ne.jp or nttdocomo.co.jp.
- severity: informational
  finding: >-
    HSTS is present only on www.docomo.ne.jp, with a six-month max-age and
    neither includeSubDomains nor preload, so it does not protect the identity
    hosts.
