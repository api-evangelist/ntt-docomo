aid: ntt-docomo
name: NTT Docomo
review:
  question: >-
    Does NTT DOCOMO expose a real, self-serve public developer portal and
    downloadable API definitions, and what is its CAMARA / GSMA Open Gateway
    posture?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Japan
  tier: mno-carrier
  gated: true
findings:
  summary: |
    NTT DOCOMO, Inc. — Japan's largest mobile network operator, roughly 90
    million subscriptions, wholly owned by NTT — publishes no self-serve API
    developer portal. Every conventional developer host on docomo.ne.jp is
    absent: developer.docomo.ne.jp, developers.docomo.ne.jp, docs.docomo.ne.jp,
    api.docomo.ne.jp and opengateway.docomo.ne.jp all fail DNS resolution
    (NXDOMAIN), and /developer/, /developers/, /api/ and /opengateway/ on
    www.docomo.ne.jp all return HTTP 404.

    The legacy first-party programme is dead. "docomo Developer support"
    (dev.smt.docomo.ne.jp), opened October 2013 as an API marketplace carrying
    DOCOMO and partner APIs (speech recognition, speech synthesis, chat
    dialogue, transit search, image recognition), was shut down on 31 March
    2021. As of this review the host does not resolve at all — the DNS record
    has been removed, so even the archived documentation is gone from the live
    web. Third-party SDKs written against it (for example github.com/hikarin522/
    docomo-api) now point at a dead host.

    One public developer page survives: https://www.docomo.ne.jp/service/
    developer/ (HTTP 200, "開発者向け情報"). It is open, requires no registration,
    and is genuinely useful — but it is handset and content technical
    information, not an API portal. It covers Machi-Chara, Deco-mail, emoji
    packages, docomo Mail themes, NFC / Osaifu-Keitai, the docomo Mail
    downloader, the docomo Mail IMAP interface, a device spec list, and sp-mode
    server IP address ranges. There is no API key issuance, no sandbox, no REST
    reference and no machine-readable definition anywhere on it.

    Exactly one machine-interface specification is published openly: the docomo
    Mail IMAP Interface Specification, a 96-page Japanese PDF
    (mail_imap_spec_260126.pdf, HTTP 200, application/pdf, 1,229,737 bytes,
    revision dated 2026-01-26). It is an IMAP protocol spec, not an HTTP API.

    The one live, anonymously reachable machine surface is identity. d ACCOUNT
    Connect (dアカウント・コネクト) is DOCOMO's OpenID Connect carrier-identity product
    for businesses — roughly 90 million accounts, approximately 2,000
    implemented sites. Its OIDC discovery document is served publicly at
    https://conf.uw.docomo.ne.jp/.well-known/openid-configuration (HTTP 200) and
    was fetched verbatim for this review. The integration manual and technical
    specification, however, are downloadable only after submitting a use
    application and passing DOCOMO's screening (審査). That is a partner gate.

    CAMARA is a press release, not an implementation. DOCOMO states in its own
    30 January 2026 release that it "has participated in the GSMA Open Gateway
    initiative" and that it has collaborated with Aduna — the Ericsson-and-
    carrier joint venture — since June 2025, concluding a formal partnership
    agreement on 29 January 2026 to make its network APIs, "developed for the
    international markets," available through Aduna's global platform. The
    release names two starting APIs: Number Verification and SIM Swap
    detection. Nothing is callable from DOCOMO directly; there is no CAMARA
    sandbox, no CAMARA OpenAPI hosted on a DOCOMO domain, no DOCOMO-branded
    Open Gateway portal, and no CAMARA client credentials path. Aduna's own
    operator wall, checked on this date, does not yet list NTT DOCOMO among its
    connected operators (it shows AT&T, Verizon, T-Mobile, Deutsche Telekom,
    Orange, Telefónica, Vodafone, Airtel, Reliance Jio, Singtel, Telstra, KDDI
    and Ericsson). So DOCOMO's network APIs are, as of this review, reachable
    neither first-party nor through the aggregator it announced.

    The same aggregator pattern repeats in payments. DOCOMO's carrier billing
    (d払い / d Payment) has no public merchant API documentation; merchants
    integrate through payment-gateway partners such as GMO Payment Gateway,
    PAYGENT and SB Payment Service, whose developer sites carry the integration
    specs rather than DOCOMO's.

    Enterprise and wholesale API demand is redirected out of the company
    entirely: https://www.docomo.ne.jp/biz/ issues a redirect to www.ntt.com,
    the site of NTT DOCOMO BUSINESS, Inc. (the renamed NTT Communications, a
    DOCOMO group company on a separate domain and separate legal entity). That
    entity does run a real API gateway developer portal at developer.ntt.com
    (HTTP 200) with a published /api-docs catalogue (Arcstar Universal One, UNO
    API, Arcstar Universal One Mobile, circuit alarms, flexible Ethernet, gm2m,
    OCN Mobile ONE Business, wholesale mobile access, Smart Data Platform, IAM,
    OAuth, API log, business process, allowed-IP management) behind account
    creation and login. It is profiled separately in the network as ntt-com and
    is deliberately NOT counted as NTT DOCOMO, Inc.'s own developer surface.
