actions:
  openapiHarvested: 0
  openapiDirectoryCreated: false
  apisListed: 2
  status: built-stub
  reason: >-
    NTT DOCOMO, Inc. publishes no self-serve API developer portal and no
    machine-readable API definitions. Two real, documented interfaces were
    captured — the OIDC-based d ACCOUNT Connect carrier identity service (public
    discovery document, gated manual) and the docomo Mail IMAP interface
    specification. Everything else is partner-gated, aggregator-mediated, or a
    press-release commitment.
