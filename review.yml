  openapi:
    harvested: false
    specsCount: 0
    note: >-
      No OpenAPI, Swagger, RAML or AsyncAPI definition is published on any NTT
      DOCOMO, Inc. host. /openapi.json returned 404; no "Download OpenAPI" link
      exists on any DOCOMO page reviewed. The openapi/ directory is therefore
      omitted from this repository.
  camara:
    posture: >-
      Press release only — GSMA Open Gateway participant, Aduna aggregation
      partner, nothing callable first-party
    apisNamedWithEvidence:
    - Number Verification
    - SIM Swap
    firstPartyCamaraEndpoint: false
    camaraSandbox: false
    camaraOpenApiHostedByDocomo: false
    evidence:
    - source: https://www.docomo.ne.jp/english/info/media_center/pr/2026/0130_00.html
      date: '2026-01-30'
      note: >-
        First-party DOCOMO press release. States the partnership agreement with
        Aduna was concluded 29 January 2026; that DOCOMO has collaborated with
        Aduna since June 2025 on an aggregation model; that DOCOMO "has
        participated in the GSMA Open Gateway initiative"; and that the
        collaboration begins with fraud-prevention use cases enabled by Number
        Verification and SIM Swap detection APIs. The release enumerates no
        other CAMARA API, publishes no endpoint, and links to no developer
        portal.
    - source: https://www.adunaglobal.com/
      date: '2026-07-25'
      note: >-
        Aduna's operator wall lists AT&T, Verizon, T-Mobile, Deutsche Telekom,
        Orange, Telefónica, Vodafone, Airtel, Reliance Jio, Singtel, Telstra,
        KDDI and Ericsson. NTT DOCOMO is not shown. Aduna groups its catalogue
        as Security, Identity, Location, Device Information, Data Connectivity
        and Network Insights.
    plainStatement: >-
      A press release is not an implementation. DOCOMO has committed to CAMARA
      Number Verification and SIM Swap and has signed the channel to deliver
      them, but as of 2026-07-25 there is no CAMARA endpoint, specification,
      sandbox or credential path published by DOCOMO, and DOCOMO is not yet
      listed on the aggregator it announced. A developer cannot call a DOCOMO
      network API today by any documented public route.
  openGateway:
    member: true
    evidence: >-
      Stated in NTT DOCOMO's own press release of 30 January 2026: DOCOMO "has
      participated in the GSMA Open Gateway initiative." The GSMA supporting-
      operators page returned HTTP 403 to anonymous fetch, so the GSMA-side list
      could not be independently confirmed in this pass.
    docomoBrandedOpenGatewayPortal: false
  tmforum:
    conformanceCertificationConfirmed: false
    note: >-
      No TM Forum Open API conformance certification was confirmed for NTT
      DOCOMO, Inc. tmforum.org returned HTTP 403 to anonymous fetch, so the
      certifications-awarded register could not be read directly. Secondary
      sources suggest a sibling group company, NTT DOCOMO SOLUTIONS, Inc.
      (formerly NTT Comware), appears on the TM Forum certification leaderboard;
      that is a different legal entity and was NOT verified in this pass and is
      not claimed here.
  threeGpp:
    nefOrScefSurface: false
    networkSlicingApi: false
    edgeMecApi: false
    note: >-
      No public NEF (Network Exposure Function) or SCEF surface, 5G
      network-slicing API, or edge/MEC API was found on any NTT DOCOMO domain.
  auth:
    schemes:
    - OpenID Connect authorization code (d ACCOUNT Connect)
    ciba: false
    cibaNote: >-
      The d ACCOUNT Connect OIDC discovery document advertises no
      backchannel_authentication_endpoint and no CIBA grant type. CAMARA
      specifies OIDC plus CIBA for network-based authorization; CIBA does not
      appear anywhere in DOCOMO's published metadata.
    openidConfiguration:
      url: https://conf.uw.docomo.ne.jp/.well-known/openid-configuration
      httpStatus: 200
      fetched: '2026-07-25'
      issuer: https://conf.uw.docomo.ne.jp/
      authorization_endpoint: https://id.smt.docomo.ne.jp/cgi8/oidc/authorize
      token_endpoint: https://conf.uw.docomo.ne.jp/token
      userinfo_endpoint: https://conf.uw.docomo.ne.jp/userinfo
      jwks_uri: https://fr-end.oidc.if.cilite.docomo.ne.jp/oft/external/ofrnt/v1.0/jwksget
      response_types_supported:
      - code
      subject_types_supported:
      - pairwise
      id_token_signing_alg_values_supported:
      - HS256
      - RS256
    oauthAuthorizationServerMetadata:
      url: https://conf.uw.docomo.ne.jp/.well-known/oauth-authorization-server
      httpStatus: 403
      note: Served but forbidden to anonymous clients.
    onboarding: >-
      d ACCOUNT Connect login-only integration is applied for online; anything
      that reads user attributes requires DOCOMO screening (審査). The technical
      manual and support libraries download only after approval. No self-serve
      key issuance exists anywhere on docomo.ne.jp.
  webhooks:
    published: false
    asyncapi: false
    note: >-
      No webhook or event catalogue is published. No AsyncAPI document exists.
      This matches the carrier pattern — the event surfaces in this sector
      belong to the CPaaS aggregators, not the operators.
  graphql:
    published: false
  grpc:
    published: false
  postman:
    publicWorkspace: false
  sdks:
    firstParty: []
    note: >-
      No first-party SDK packages were found on npm, PyPI, Maven Central or
      NuGet. The github.com/docomo organisation exists (id 9855700) but contains
      zero public repositories; github.com/nttdocomo and github.com/ntt-docomo
      return 404. d ACCOUNT Connect "support libraries" exist but download only
      after application approval.
  channelToDevelopers:
    direct: false
    viaAggregator: true
    aggregators:
    - name: Aduna
      role: >-
        Announced global aggregator for DOCOMO's international network APIs
        (Number Verification, SIM Swap). Partnership concluded 29 January 2026;
        DOCOMO not yet listed on Aduna's operator wall as of 2026-07-25.
    - name: GMO Payment Gateway / PAYGENT / SB Payment Service
      role: >-
        Carrier-billing (d払い) integration partners. DOCOMO publishes no
        merchant API docs; the payment gateways carry the integration specs.
    - name: NTT DOCOMO BUSINESS, Inc.
      role: >-
        Sibling group entity on ntt.com that runs the group's actual enterprise
        API gateway portal (developer.ntt.com, login-gated). docomo.ne.jp/biz
        redirects there. Profiled separately as ntt-com.
    plainStatement: >-
      NTT DOCOMO reaches developers only through intermediaries. Its own
      developer programme is closed, its network APIs are routed to an
      aggregator that has not yet listed it, its billing rails are sold through
      payment gateways, and its enterprise API portal belongs to a different
      subsidiary on a different domain. This is the central pattern of the
      telecom sector expressed almost purely.
  transports:
  - protocol: HTTPS
    scheme: https
    documented: true
    note: >-
      OpenID Connect authorization-code flow for d ACCOUNT Connect. Discovery
      document publicly readable; full specification gated behind application.
  - protocol: IMAP
    scheme: imaps
    documented: true
    note: >-
      docomo Mail IMAP interface, specified in a 96-page public PDF revised
      2026-01-26.
  - protocol: REST
    documented: false
    note: No public REST API is documented by NTT DOCOMO, Inc.
  - protocol: GraphQL
    documented: false
  - protocol: gRPC
    documented: false
  - protocol: WebSocket
    scheme: wss
    documented: false
